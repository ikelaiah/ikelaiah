<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Iwan Kelaiah</title>
  <desc id="description">Iwan Kelaiah — practical developer tools, Free Pascal, and data engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2d"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentRule" gradientUnits="userSpaceOnUse" x1="286" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ba3c7" stroke-width="1" opacity=".055"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="298" rx="28"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#background)" stroke="#263653" stroke-width="2"/>
  <rect x="920" y="1" width="279" height="298" fill="url(#grid)" clip-path="url(#frame)"/>

  <g transform="translate(56 66)">
    <rect width="168" height="168" rx="34" fill="url(#accent)"/>
    <text x="84" y="112" text-anchor="middle" fill="#0b1220"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="700" letter-spacing="-2">IK</text>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="284" y="146" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-2">Iwan <tspan fill="#67e8f9">Kelaiah</tspan></text>
    <text x="288" y="192" fill="#a8b5ca" font-size="17" font-weight="600" letter-spacing="2.4">PRACTICAL DEVELOPER TOOLS &#183; FREE PASCAL &#183; DATA</text>
  </g>

  <path d="M286 228H1120" stroke="#263653" stroke-width="2"/>
  <path d="M286 228H430" stroke="url(#accentRule)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1120" cy="228" r="3" fill="#67e8f9" opacity=".8"/>
</svg>
